"[package]\nname = \"bevy_diagnostic\"\nversion = \"0.19.0-dev\"\npublish = false\nedition = \"2024\"\ndescription = \"Provides diagnostic functionality for Bevy Engine\"\nhomepage = \"https://bevy.org\"\nrepository = \"https://github.com/bevyengine/bevy\"\nlicense = \"MIT OR Apache-2.0\"\nkeywords = [\"bevy\"]\n\n[features]\ndefault = [\"std\", \"bevy_ecs/default\"]\n\n# Functionality\n\n## Adds serialization support through `serde`.\nserialize = [\n  \"dep:serde\",\n  \"bevy_ecs/serialize\",\n  \"bevy_time/serialize\",\n  \"bevy_platform/serialize\",\n]\n\n## Disables diagnostics that are unsupported when Bevy is dynamically linked\ndynamic_linking = []\n\n## Adds integration with `sysinfo`.\nsysinfo_plugin = [\"sysinfo\"]\n\n# Platform Compatibility\n\n## Allows access to the `std` crate. Enabling this feature will prevent compilation\n## on `no_std` targets, but provides access to certain additional features on\n## supported platforms.\nstd = [\n  \"serde?/std\",\n  \"bevy_ecs/std\",\n  \"bevy_app/std\",\n  \"bevy_platform/std\",\n  \"bevy_time/std\",\n]\n\n## `critical-section` provides the building blocks for synchronization primitives\n## on all platforms, including `no_std`.\ncritical-section = [\n  \"bevy_ecs/critical-section\",\n  \"bevy_app/critical-section\",\n  \"bevy_platform/critical-section\",\n  \"bevy_time/critical-section\",\n]\n\n[dependencies]\n# bevy\nbevy_app = { path = \"../bevy_app\", version = \"0.19.0-dev\", default-features = false }\nbevy_ecs = { path = \"../bevy_ecs\", version = \"0.19.0-dev\", default-features = false }\nbevy_time = { path = \"../bevy_time\", version = \"0.19.0-dev\", default-features = false }\nbevy_tasks = { path = \"../bevy_tasks\", version = \"0.19.0-dev\", default-features = false }\nbevy_platform = { path = \"../bevy_platform\", version = \"0.19.0-dev\", default-features = false, features = [\n  \"alloc\",\n] }\n\n# other\natomic-waker = { version = \"1\", default-features = false }\nconst-fnv1a-hash = \"1.1.0\"\nserde = { version = \"1.0\", default-features = false, features = [\n  \"alloc\",\n], optional = true }\nlog = { version = \"0.4\", default-features = false }\n\n# macOS\n[target.'cfg(all(target_os=\"macos\"))'.dependencies]\n# Some features of sysinfo are not supported by apple. This will disable those features on apple devices\nsysinfo = { version = \"0.38.4\", optional = true, default-features = false, features = [\n  \"apple-app-store\",\n  \"system\",\n] }\n\n# Only include when on linux/windows/android/freebsd/netbsd\n[target.'cfg(any(target_os = \"linux\", target_os = \"windows\", target_os = \"android\", target_os = \"freebsd\", target_os = \"netbsd\"))'.dependencies]\nsysinfo = { version = \"0.38.4\", optional = true, default-features = false, features = [\n  \"system\",\n] }\n\n[dev-dependencies]\nserde_test = \"1.0\"\n\n[lints.clippy]\ndoc_markdown = \"warn\"\nmanual_let_else = \"warn\"\nmatch_same_arms = \"warn\"\nredundant_closure_for_method_calls = \"warn\"\nredundant_else = \"warn\"\nsemicolon_if_nothing_returned = \"warn\"\ntype_complexity = \"allow\"\nundocumented_unsafe_blocks = \"warn\"\nunwrap_or_default = \"warn\"\nneedless_lifetimes = \"allow\"\ntoo_many_arguments = \"allow\"\nnonstandard_macro_braces = \"warn\"\nprint_stdout = \"warn\"\nprint_stderr = \"warn\"\nptr_as_ptr = \"warn\"\nptr_cast_constness = \"warn\"\nref_as_ptr = \"warn\"\ntoo_long_first_doc_paragraph = \"allow\"\nstd_instead_of_core = \"allow\"\nstd_instead_of_alloc = \"warn\"\nalloc_instead_of_core = \"warn\"\nallow_attributes = \"warn\"\nallow_attributes_without_reason = \"warn\"\n\n[lints.rust]\nmissing_docs = \"warn\"\nunexpected_cfgs = { level = \"warn\", check-cfg = ['cfg(docsrs_dep)'] }\nunsafe_code = \"deny\"\nunsafe_op_in_unsafe_fn = \"warn\"\nunused_qualifications = \"warn\"\n\n\n[package.metadata.docs.rs]\nrustdoc-args = [\n  \"-Zunstable-options\",\n  \"--generate-link-to-definition\",\n  \"--generate-macro-expansion\",\n]\nall-features = true\n"
